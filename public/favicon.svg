<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Psychic Neon Aura Gradient -->
    <linearGradient id="mewPsychicGlow" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="auraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#090c15" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Iconic Long Sweeping Overhead Tail with Oval Tip -->
  <!-- Tail Oval Tip -->
  <ellipse cx="78" cy="27" rx="14" ry="5.5" transform="rotate(-15 78 27)" 
           stroke="url(#mewPsychicGlow)" stroke-width="3" fill="rgba(168, 85, 247, 0.18)" filter="url(#auraGlow)"/>

  <!-- Sweeping Tail Arc -->
  <path d="M 64 29 
           C 40 22, 24 38, 26 62 
           C 28 78, 42 86, 54 78" 
        stroke="url(#mewPsychicGlow)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#auraGlow)"/>

  <!-- Floating Mythical Feline Silhouette Body -->
  <!-- Head, Ears, Face -->
  <path d="M 72 37 
           C 74 34, 76 34, 77 37 
           C 78 40, 84 41, 84 44 
           C 84 48, 81 50, 78 52 
           C 76 54, 74 58, 74 62" 
        stroke="url(#mewPsychicGlow)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#auraGlow)"/>

  <!-- Front Floating Paws -->
  <path d="M 74 53 
           C 74 57, 72 66, 69 67 
           C 67 67, 66 63, 67 58" 
        stroke="url(#mewPsychicGlow)" stroke-width="2.8" stroke-linecap="round" fill="none" filter="url(#auraGlow)"/>

  <path d="M 72 58 
           C 73 63, 76 69, 78 69 
           C 79 69, 79 65, 78 60" 
        stroke="url(#mewPsychicGlow)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#auraGlow)"/>

  <!-- Back & Trailing Hind Legs -->
  <path d="M 72 37 
           C 68 40, 68 46, 66 52 
           C 63 60, 56 68, 52 74 
           C 49 78, 43 89, 41 94 
           C 39 96, 42 98, 46 91 
           C 50 83, 56 79, 62 76" 
        stroke="url(#mewPsychicGlow)" stroke-width="3.2" stroke-linecap="round" fill="none" filter="url(#auraGlow)"/>

  <path d="M 54 78 
           C 52 83, 49 92, 48 95 
           C 47 97, 50 98, 53 93 
           C 57 86, 61 80, 65 74" 
        stroke="url(#mewPsychicGlow)" stroke-width="2.8" stroke-linecap="round" fill="none" filter="url(#auraGlow)"/>

  <!-- Cute Eye Spark -->
  <circle cx="79" cy="42" r="1.8" fill="#22d3ee" filter="url(#auraGlow)"/>
</svg>
